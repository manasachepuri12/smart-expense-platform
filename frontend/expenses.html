<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expenses | Smart Expense Platform</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="font-[Inter] bg-slate-100">

    <div class="flex min-h-screen">

        <!-- Sidebar -->

        <aside class="w-72 bg-[#001D39] text-white flex flex-col">

            <div class="p-8 border-b border-white/20">

                <h1 class="text-3xl font-bold">

                    <i class="fa-solid fa-wallet mr-2"></i>

                    Smart Expense

                </h1>

            </div>

            <nav class="flex-1 p-6">

                <ul class="space-y-4">

                    <li>
                        <a href="dashboard.html" class="flex items-center gap-3 p-3 hover:bg-white/10 rounded-xl">
                            <i class="fa-solid fa-house"></i>
                            Dashboard
                        </a>
                    </li>

                    <li>
                        <a href="expenses.html" class="flex items-center gap-3 bg-white/10 rounded-xl p-3">
                            <i class="fa-solid fa-receipt"></i>
                            Expenses
                        </a>
                    </li>

                    <li>
                        <a href="income.html" class="flex items-center gap-3 p-3 hover:bg-white/10 rounded-xl">
                            <i class="fa-solid fa-money-bill-trend-up"></i>
                            Income
                        </a>
                    </li>

                    <li>
                        <a href="budget.html" class="flex items-center gap-3 p-3 hover:bg-white/10 rounded-xl">
                            <i class="fa-solid fa-piggy-bank"></i>
                            Budget
                        </a>
                    </li>

                    <li>
                        <a href="analytics.html" class="flex items-center gap-3 p-3 hover:bg-white/10 rounded-xl">
                            <i class="fa-solid fa-chart-line"></i>
                            Analytics
                        </a>
                    </li>

                    <li>
                        <a href="reports.html" class="flex items-center gap-3 p-3 hover:bg-white/10 rounded-xl">
                            <i class="fa-solid fa-file-lines"></i>
                            Reports
                        </a>
                    </li>
                    <li>
                        <a href="profile.html" class="flex items-center gap-3 p-3 hover:bg-white/10 rounded-xl">
                            <i class="fa-solid fa-user"></i>
                            Profile
                        </a>
                    </li>

                    <li class="pt-8 border-t border-white/20 mt-8">
                        <a href="#" onclick="logout()" class="flex items-center gap-3 p-3 hover:bg-red-500 rounded-xl">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            Logout
                        </a>
                    </li>


                </ul>

            </nav>

        </aside>

        <!-- Main Content -->

        <main class="flex-1">

            <!-- Header -->

            <header class="bg-white shadow-sm px-10 py-5 flex justify-between items-center">

                <div>

                    <h2 class="text-3xl font-bold text-slate-800">

                        Expenses

                    </h2>

                    <p class="text-slate-500">

                        Manage all your expenses

                    </p>

                </div>

                <button id="addExpenseBtn" class="btn-primary px-6 py-3 rounded-xl">

                    <i class="fa-solid fa-plus mr-2"></i>

                    Add Expense

                </button>

            </header>

            <!-- Content -->

            <section class="p-10">

                <!-- Search -->

                <div class="card p-6 mb-8">

                    <div class="flex justify-between items-center flex-wrap gap-4">

                        <input type="text" id="expenseSearch" placeholder="Search expenses..."
                            class="w-full md:w-96 rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                        <select id="categoryFilter" class="rounded-xl border border-gray-300 px-4 py-3">
                            <option value="">All Categories</option>
                        </select>

                    </div>

                </div>

                <!-- Expense Table -->

                <div class="card p-8">

                    <h3 class="text-2xl font-bold mb-6">

                        Expense History

                    </h3>

                    <div class="overflow-x-auto">

                        <table class="w-full">

                            <thead>

                                <tr class="border-b text-left">

                                    <th class="py-4">Title</th>
                                    <th>Category</th>
                                    <th>Amount</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>

                                </tr>

                            </thead>

                            <tbody id="expenseTableBody">
                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </main>

    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/expenses.js"></script>
</body>

</html>
